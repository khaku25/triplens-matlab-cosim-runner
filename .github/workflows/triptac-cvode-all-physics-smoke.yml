name: TripTAC CVODE All Physics 10s Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/triptac-cvode-all-physics-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  all-physics-10s:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TRIPLENS_USE_NATIVE_SEED: '1'
      TRIPLENS_RETAIN_VALIDATED_NLS_GUESS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the already executed Run4 Linux CVODE FMU
        uses: actions/download-artifact@v4
        with:
          name: cvode-build-linux64-4
          run-id: 34233967732
          github-token: ${{ github.token }}
          path: proven
      - run: python3 -m pip install 'fmpy==0.3.22' 'h5py==3.12.1'
      - name: Read every dynamic FMI variable for 10 seconds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python3 ci/cvode/probe_all_dynamic_long.py \
            --fmu proven/TripLens_CombinedCycle_TripTAC_CoSim_linux64.fmu \
            --out results --stop 10 --step 0.1 --label proven_all_dynamic_10s \
            2> >(grep --line-buffered -E 'TRIPLENS_FMI_INTERNAL_SOLVER|TRIPLENS_CVODE_FMI_CALLBACK_CLEANUP_PASS|ERROR|Error|error|assert|CVODE' | tee results/runtime_key.log >&2)
          cat results/long_all_dynamic_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proven-all-physics-10s
          path: results/
          if-no-files-found: warn
          retention-days: 30
