name: Windows OMEdit Warm Start Setup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-omedit-warm-start-setup.yml'
      - 'ci/install_omedit_warm_start.ps1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare-warm-start:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download verified full-state snapshot
        uses: actions/download-artifact@v4
        with:
          name: triptac-native-full-state-1
          run-id: 34220970632
          github-token: ${{ github.token }}
          path: warm_snapshot

      - name: Install warm-start workspace on C drive
        shell: cmd
        run: |
          "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\ci\install_omedit_warm_start.ps1" -SourceRoot "%GITHUB_WORKSPACE%\warm_snapshot" -Dest "C:\TripLensWarm"

      - name: Verify installed files with cmd
        shell: cmd
        run: |
          if not exist C:\TripLensWarm\native_full_res.mat exit /b 1
          if not exist C:\TripLensWarm\reference.mo exit /b 1
          if not exist C:\TripLensWarm\run_warm_start.ps1 exit /b 1
          if not exist C:\TripLensWarm\README_WARM_START.txt exit /b 1
          dir C:\TripLensWarm
          echo WINDOWS_OMEDIT_WARM_START_WORKSPACE_READY
