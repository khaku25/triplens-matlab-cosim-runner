name: MATLAB ECMS GT Trip Fast Trend 3.1

on:
  push:
    branches:
      - codex/gt-trip-button-fast-trend-20260911
    paths:
      - matlab/run_matlab_gt_trip_trend.m
      - matlab/gt_trip_trend_opcua_client.py
      - .github/workflows/matlab-native-opcua-ecms.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: matlab-ecms-gt-trip-fast-trend-${{ github.ref }}
  cancel-in-progress: true

env:
  THERMOSYSPRO_COMMIT: db81ae1b5a6a85f6c6c7693244cafa6087e18ff5
  TRIPLENS_OPCUA_HOST: 127.0.0.1
  TRIPLENS_OPCUA_PORT: '4841'
  TRIPLENS_OPCUA_STOP_TIME: '70'
  TRIPLENS_OPCUA_STEP_SIZE: '0.5'
  TRIPLENS_OPCUA_COMMAND_TIME: '10'

jobs:
  prepare-modelica323:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out validated ThermoSysPro adapter
        uses: actions/checkout@v4
        with:
          repository: khaku25/triplens-thermosyspro-cloud-runner
          ref: codex/live-main-fmu-ecms-20260910
          path: thermo_server
          persist-credentials: false

      - name: Build exact Modelica 3.2.3 offline archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p thermo_server/build/omhome
          docker run --rm \
            -v "$PWD/thermo_server/build/omhome:/root" \
            -v "$PWD/thermo_server:/workspace" \
            -w /workspace \
            openmodelica/openmodelica:v1.27.0-minimal \
            omc /workspace/modelica/install_dependencies.mos
          docker run --rm \
            -v "$PWD/thermo_server/build/omhome:/root" \
            -v "$PWD:/repo" \
            openmodelica/openmodelica:v1.27.0-minimal \
            sh -c 'test -d /root/.openmodelica/libraries && tar -chzf /repo/modelica323_bundle.tar.gz -C /root/.openmodelica libraries && chmod 644 /repo/modelica323_bundle.tar.gz'
          test -s modelica323_bundle.tar.gz

      - name: Upload exact Modelica library archive
        uses: actions/upload-artifact@v4
        with:
          name: matlab-opcua-modelica323-${{ github.run_number }}
          path: modelica323_bundle.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-native-windows:
    needs: prepare-modelica323
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Check out MATLAB ECMS repository
        uses: actions/checkout@v4

      - name: Check out validated ThermoSysPro adapter
        uses: actions/checkout@v4
        with:
          repository: khaku25/triplens-thermosyspro-cloud-runner
          ref: codex/live-main-fmu-ecms-20260910
          path: thermo_server
          persist-credentials: false

      - name: Download exact Modelica library archive
        uses: actions/download-artifact@v4
        with:
          name: matlab-opcua-modelica323-${{ github.run_number }}
          path: modelica_bundle

      - name: Restore official OpenModelica installer cache
        uses: actions/cache@v4
        with:
          path: C:\openmodelica-cache
          key: openmodelica-windows-installer-1.27.0-x64

      - name: Install official OpenModelica 1.27.0
        shell: cmd
        run: |
          if not exist C:\openmodelica-cache mkdir C:\openmodelica-cache
          if not exist C:\openmodelica-cache\OpenModelica-v1.27.0-64bit.exe curl.exe -fL --retry 4 --retry-delay 5 -o C:\openmodelica-cache\OpenModelica-v1.27.0-64bit.exe https://build.openmodelica.org/omc/builds/windows/releases/1.27/0/64bin/OpenModelica-v1.27.0-64bit.exe
          if errorlevel 1 exit /b 1
          curl.exe -fL --retry 4 --retry-delay 5 -o C:\openmodelica-cache\OpenModelica-v1.27.0-64bit.exe.md5sum https://build.openmodelica.org/omc/builds/windows/releases/1.27/0/64bin/OpenModelica-v1.27.0-64bit.exe.md5sum
          if errorlevel 1 exit /b 1
          for /f "tokens=1" %%H in (C:\openmodelica-cache\OpenModelica-v1.27.0-64bit.exe.md5sum) do certutil -hashfile C:\openmodelica-cache\OpenModelica-v1.27.0-64bit.exe MD5 | findstr /i /c:"%%H" >nul
          if errorlevel 1 exit /b 1
          start /wait "" C:\openmodelica-cache\OpenModelica-v1.27.0-64bit.exe /S /D=C:\OpenModelica1.27.0-64bit
          if errorlevel 1 exit /b 1
          if not exist C:\OpenModelica1.27.0-64bit\bin\omc.exe exit /b 1

      - name: Map ASCII workspace
        shell: cmd
        run: |
          subst T: /d >nul 2>nul
          subst T: "%GITHUB_WORKSPACE%"
          if errorlevel 1 exit /b 1

      - name: Prepare pinned native ThermoSysPro source
        shell: cmd
        run: |
          T:
          if not exist T:\omlib mkdir T:\omlib
          if not exist T:\omprofile\AppData\Roaming\.openmodelica\libraries mkdir T:\omprofile\AppData\Roaming\.openmodelica\libraries
          if not exist T:\omprofile\AppData\Local mkdir T:\omprofile\AppData\Local
          if not exist T:\thermo_server\vendor mkdir T:\thermo_server\vendor
          if not exist T:\thermo_server\build mkdir T:\thermo_server\build
          tar -xzf T:\modelica_bundle\modelica323_bundle.tar.gz -C T:\omlib
          if errorlevel 1 exit /b 1
          if not exist T:\omlib\libraries\index.json exit /b 1
          xcopy /E /I /Q /Y T:\omlib\libraries T:\omprofile\AppData\Roaming\.openmodelica\libraries >nul
          if errorlevel 1 exit /b 1
          if not exist T:\omprofile\AppData\Roaming\.openmodelica\libraries\index.json exit /b 1
          if exist T:\thermo_server\vendor\ThermoSysPro rmdir /s /q T:\thermo_server\vendor\ThermoSysPro
          "C:\Program Files\Git\cmd\git.exe" clone --no-checkout https://github.com/Dwarf-Planet-Project/ThermoSysPro.git T:\thermo_server\vendor\ThermoSysPro
          if errorlevel 1 exit /b 1
          "C:\Program Files\Git\cmd\git.exe" -C T:\thermo_server\vendor\ThermoSysPro checkout --detach %THERMOSYSPRO_COMMIT%
          if errorlevel 1 exit /b 1
          python T:\thermo_server\scripts\render_modelica.py --external-trip-input --stop-time %TRIPLENS_OPCUA_STOP_TIME% --intervals 140
          if errorlevel 1 exit /b 1
          python T:\thermo_server\scripts\patch_turbine_bypass_model.py ^
            --source T:\thermo_server\vendor\ThermoSysPro\ThermoSysPro\Examples\CombinedCyclePowerPlant\CombinedCycle_TripTAC.mo
          if errorlevel 1 exit /b 1
          python T:\thermo_server\scripts\patch_stodola_turbine.py ^
            T:\thermo_server\vendor\ThermoSysPro\ThermoSysPro\WaterSteam\Machines\StodolaTurbine.mo
          if errorlevel 1 exit /b 1
          python -c "from pathlib import Path; p=Path(r'T:\thermo_server\build\build_native_opcua.mos'); p.write_text(p.read_text(encoding='utf-8').replace('/workspace/','T:/thermo_server/'),encoding='utf-8')"
          if errorlevel 1 exit /b 1

      - name: Build native Windows OpenModelica OPC UA server
        shell: cmd
        run: |
          set "OMC_ROOT=C:\OpenModelica1.27.0-64bit"
          set "APPDATA=T:\omprofile\AppData\Roaming"
          set "LOCALAPPDATA=T:\omprofile\AppData\Local"
          set "OPENMODELICALIBRARY=T:\omprofile\AppData\Roaming\.openmodelica\libraries;T:\omlib\libraries"
          if not exist "%OMC_ROOT%\bin\omc.exe" exit /b 1
          "%OMC_ROOT%\bin\omc.exe" T:\thermo_server\build\build_native_opcua.mos > T:\thermo_server\build\native-opcua-windows-build.log 2>&1
          set "OMC_EXIT=%ERRORLEVEL%"
          type T:\thermo_server\build\native-opcua-windows-build.log
          if not "%OMC_EXIT%"=="0" exit /b %OMC_EXIT%
          if not exist T:\thermo_server\build\TripLens_Native_OPCUA.exe exit /b 1
          if not exist T:\thermo_server\build\TripLens_Native_OPCUA_init.xml exit /b 1
          findstr /c:"vppExternalTripCommandNative" T:\thermo_server\build\TripLens_Native_OPCUA_init.xml > T:\thermo_server\build\native-opcua-input-contract.txt
          if errorlevel 1 exit /b 1

      - name: Collect native Windows runtime
        shell: cmd
        run: |
          set "OMC_ROOT=C:\OpenModelica1.27.0-64bit"
          if exist T:\windows_native_server rmdir /s /q T:\windows_native_server
          mkdir T:\windows_native_server\omc-bin
          mkdir T:\windows_native_server\mingw-bin
          copy /Y T:\thermo_server\build\TripLens_Native_OPCUA* T:\windows_native_server\
          if errorlevel 1 exit /b 1
          copy /Y T:\thermo_server\build\native-opcua-windows-build.log T:\windows_native_server\
          copy /Y T:\thermo_server\build\native-opcua-input-contract.txt T:\windows_native_server\
          copy /Y "%OMC_ROOT%\bin\*.dll" T:\windows_native_server\omc-bin\
          if errorlevel 1 exit /b 1
          if exist "%OMC_ROOT%\tools\msys\mingw64\bin\*.dll" copy /Y "%OMC_ROOT%\tools\msys\mingw64\bin\*.dll" T:\windows_native_server\mingw-bin\

      - name: Upload native Windows OPC UA server
        uses: actions/upload-artifact@v4
        with:
          name: matlab-opcua-native-windows-${{ github.run_number }}
          path: windows_native_server/**
          if-no-files-found: error
          retention-days: 7

      - name: Remove ASCII workspace mapping
        if: always()
        shell: cmd
        run: |
          subst T: /d >nul 2>nul
          exit /b 0

  matlab-opcua-windows:
    needs: build-native-windows
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Check out MATLAB ECMS repository
        uses: actions/checkout@v4

      - name: Check out dashboard builder
        uses: actions/checkout@v4
        with:
          repository: khaku25/triplens-thermosyspro-cloud-runner
          ref: codex/live-main-fmu-ecms-20260910
          path: thermo_server
          persist-credentials: false

      - name: Download native Windows OPC UA server
        uses: actions/download-artifact@v4
        with:
          name: matlab-opcua-native-windows-${{ github.run_number }}
          path: native_server

      - name: Download validated SST-free MATLAB ECMS model
        uses: actions/download-artifact@v4
        with:
          name: trip-breaker-semantics-4
          path: ecms_artifact
          repository: khaku25/triplens-matlab-cosim-runner
          run-id: '34314118578'
          github-token: ${{ github.token }}

      - name: Select actual MATLAB ECMS v2 model
        shell: powershell
        run: |
          $model = Get-ChildItem ecms_artifact -Recurse `
            -Filter TripLens_ECMS_DigitalTwin_trip_semantics_v2.slx | Select-Object -First 1
          if ($null -eq $model) { throw 'Validated ECMS v2 model missing' }
          "TRIPLENS_ECMS_MODEL_PATH=$($model.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up MATLAB R2026a with OPC UA and Simulink
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
          products: >
            Simulink
            Industrial_Communication_Toolbox
          cache: true

      - name: Install pinned live OPC UA transport adapter
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check `
            -r thermo_server\requirements-live.txt
          python -c "from opcua import Client; print('PYTHON_OPCUA_ADAPTER_READY')"

      - name: Stage native Windows OPC UA physical server
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem native_server -Recurse -Filter TripLens_Native_OPCUA.exe | Select-Object -First 1
          if ($null -eq $exe) { throw 'Native server executable missing from artifact' }
          $serverDir = $exe.Directory.FullName
          $dllDirs = Get-ChildItem native_server -Directory -Recurse | Where-Object {
            (Get-ChildItem $_.FullName -Filter *.dll -File -ErrorAction SilentlyContinue).Count -gt 0
          }
          foreach ($dir in $dllDirs) {
            $dir.FullName | Out-File $env:GITHUB_PATH -Append -Encoding utf8
            $env:PATH = "$($dir.FullName);$env:PATH"
          }
          "TRIPLENS_OPCUA_SERVER_DIR=$serverDir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'WINDOWS_NATIVE_OPCUA_SERVER_STAGED'

      - name: Run optimized ECMS GT Trip button and OPC UA trend
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath(fullfile(getenv('GITHUB_WORKSPACE'),'matlab'));
            run_matlab_gt_trip_trend

      - name: Verify optimized trend evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'outputs\matlab-native-opcua\ECMS-GT-Trip-trend.csv',
            'outputs\matlab-native-opcua\GT-Trip-trend.png',
            'outputs\matlab-native-opcua\gt-trip-trend-proof.json'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing GT Trip trend evidence: $file" }
          }
          $proof = Get-Content 'outputs\matlab-native-opcua\gt-trip-trend-proof.json' -Raw | ConvertFrom-Json
          if ($proof.status -ne 'PASS') { throw 'GT Trip trend proof did not pass' }
          if ($proof.output_forcing -ne $false) { throw 'Output forcing must remain disabled' }
          if ($proof.alarm_evaluation_enabled -ne $false) { throw 'Alarm evaluation must remain disabled' }

      - name: Preserve native server logs
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path outputs\matlab-native-opcua | Out-Null
          if ($env:TRIPLENS_OPCUA_SERVER_DIR) {
            Copy-Item "$env:TRIPLENS_OPCUA_SERVER_DIR\openmodelica-native*.log" `
              outputs\matlab-native-opcua -ErrorAction SilentlyContinue
          }

      - name: Upload MATLAB OPC UA physical-link evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-ecms-gt-trip-fast-trend-${{ github.run_number }}
          path: |
            outputs/matlab-native-opcua/**
            outputs/trip_breaker_semantics_report.json
            outputs/TripLens_ECMS_Trip_Breaker_Semantics_Core.slx
          if-no-files-found: warn
          retention-days: 30

      - name: Stop native server if still running
        if: always()
        shell: powershell
        run: |
          if ($env:TRIPLENS_OPCUA_SERVER_PID) {
            Stop-Process -Id ([int]$env:TRIPLENS_OPCUA_SERVER_PID) -Force -ErrorAction SilentlyContinue
          }
          if ($env:TRIPLENS_OPCUA_SERVER_DIR) {
            $pidFile = Join-Path $env:TRIPLENS_OPCUA_SERVER_DIR 'active-opcua-server.pid'
            if (Test-Path $pidFile) {
              $activePid = (Get-Content $pidFile -Raw).Trim()
              if ($activePid -match '^\d+$') {
                Stop-Process -Id ([int]$activePid) -Force -ErrorAction SilentlyContinue
              }
            }
          }
