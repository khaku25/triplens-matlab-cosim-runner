name: Closed Loop ECMS Thermo Trip

on:
  workflow_run:
    workflows: ["Build TripTAC Co-Sim FMU"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: closed-loop-ecms-thermo-trip
  cancel-in-progress: true

jobs:
  closed-loop:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Check out latest integration code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Download triggering 3-input TripTAC FMU
        uses: actions/download-artifact@v4
        with:
          name: triplens-triptac-cosim-fmu-${{ github.event.workflow_run.run_number }}
          path: fmu_artifact
          repository: khaku25/triplens-matlab-cosim-runner
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify downloaded physical interface source artifact exists
        shell: cmd
        run: |
          dir /s /b fmu_artifact
          dir /s /b "fmu_artifact\TripLens_CombinedCycle_TripTAC_CoSim.fmu" >nul || exit /b 1

      - name: Build dashboard, install protection, wire closed loop, and regress
        shell: cmd
        run: |
          "C:\Program Files\MATLAB\R2025b\bin\matlab.exe" -batch "addpath(fullfile(getenv('GITHUB_WORKSPACE'),'matlab')); build_triptac_cosim_dashboard; addpath(fullfile(getenv('GITHUB_WORKSPACE'),'ecms_logic')); build_a_logic_core; install_a_logic_into_ecms; addpath(fullfile(getenv('GITHUB_WORKSPACE'),'matlab')); build_closed_loop_trip_cosim; apply_trip_breaker_semantics_v2; fix_first_order_alarm_timing; addpath(fullfile(getenv('GITHUB_WORKSPACE'),'ecms_logic')); export_ecms_traceability"

      - name: Upload closed-loop physical-trip evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closed-loop-ecms-thermo-trip-${{ github.run_number }}
          path: |
            outputs/triptac_cosim_dashboard_report.json
            outputs/ecms_a_logic_core_report.json
            outputs/ecms_a_logic_install_report.json
            outputs/closed_loop_trip_cosim_report.json
            outputs/trip_semantics_v2_install_report.json
            outputs/first_order_alarm_timing_report.json
            outputs/ecms_port_traceability.csv
            outputs/ecms_traceability_report.json
            outputs/ecms_traceability_report.html
            outputs/ecms_protection_control.png
            outputs/ecms_a_logic_hierarchy.png
            outputs/TripLens_ECMS_DigitalTwin_closed_loop.slx
            outputs/TripLens_ECMS_DigitalTwin_trip_semantics_v2.slx
          if-no-files-found: warn
          retention-days: 30
