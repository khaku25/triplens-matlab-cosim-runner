name: Run TripLens MATLAB Co-Sim

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Select validation or physical co-simulation stage
        required: true
        type: choice
        default: legacy-exact
        options:
          - legacy-exact
          - smoke
          - bfp-wrapper-check
          - bfp-cosim
      bfp_trip_time_s:
        description: HP BFP trip start time (bfp-cosim)
        required: true
        default: "300"
      bfp_ramp_duration_s:
        description: HP BFP 1400 to 0 rpm ramp duration (bfp-cosim)
        required: true
        default: "2"
      stop_time_s:
        description: ThermoSysPro simulation stop time
        required: true
        default: "1000"
      intervals:
        description: ThermoSysPro output intervals
        required: true
        default: "1000"

permissions:
  contents: read

concurrency:
  group: triplens-matlab-cosim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matlab-cosim:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180

    steps:
      - name: Check out co-sim repository
        uses: actions/checkout@v4

      - name: Show runner identity
        shell: cmd
        run: |
          echo Runner: %RUNNER_NAME%
          echo Machine: %COMPUTERNAME%
          echo Workspace: %GITHUB_WORKSPACE%
          if exist "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" (echo Windows PowerShell: found) else (echo Windows PowerShell: MISSING & exit /b 1)
          exit /b 0

      - name: Run exact legacy Action baseline
        if: ${{ github.event_name == 'push' || inputs.mode == 'legacy-exact' }}
        shell: cmd
        run: |
          "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File ".\scripts\run_legacy_exact.ps1" -TripTime 600 -TripRampDuration 5 -StopTime 1000 -Intervals 1000

      - name: Upload exact legacy outputs
        if: ${{ always() && (github.event_name == 'push' || inputs.mode == 'legacy-exact') }}
        uses: actions/upload-artifact@v4
        with:
          name: triplens-legacy-exact-${{ github.run_number }}
          path: |
            outputs/legacy_exact/
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare ThermoSysPro source for experimental MATLAB path
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'legacy-exact' }}
        shell: cmd
        run: |
          if exist "vendor\ThermoSysPro\ThermoSysPro\package.mo" exit /b 0
          if exist "vendor\ThermoSysPro" rmdir /s /q "vendor\ThermoSysPro"
          mkdir vendor 2>nul
          "C:\Program Files\Git\cmd\git.exe" clone --depth 1 https://gitlab.pam-retd.fr/thermosysproandco/ThermoSysPro.git "vendor\ThermoSysPro"
          if errorlevel 1 exit /b 1
          exit /b 0

      - name: Map ASCII workspace for experimental MATLAB path
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'legacy-exact' }}
        shell: cmd
        run: |
          subst T: /d >nul 2>nul
          subst T: "%GITHUB_WORKSPACE%"
          if errorlevel 1 exit /b 1
          exit /b 0

      - name: Run on installed MATLAB
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'legacy-exact' }}
        shell: cmd
        env:
          TRIPLENS_COSIM_MODE: ${{ inputs.mode }}
          TRIPLENS_BFP_TRIP_TIME: ${{ inputs.bfp_trip_time_s }}
          TRIPLENS_BFP_RAMP_DURATION: ${{ inputs.bfp_ramp_duration_s }}
          TRIPLENS_STOP_TIME: ${{ inputs.stop_time_s }}
          TRIPLENS_INTERVALS: ${{ inputs.intervals }}
          TRIPLENS_COSIM_REPO_ROOT: T:\
          TRIPLENS_THERMOSYSPRO_ROOT: T:\vendor\ThermoSysPro
        run: |
          "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File ".\scripts\run_installed_matlab.ps1" -Mode "%TRIPLENS_COSIM_MODE%"

      - name: Upload experimental co-sim outputs
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mode != 'legacy-exact' }}
        uses: actions/upload-artifact@v4
        with:
          name: triplens-matlab-cosim-${{ github.run_number }}
          path: |
            outputs/
            build/bfp_physical/*.mos
          if-no-files-found: warn
          retention-days: 30

      - name: Remove ASCII workspace mapping
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mode != 'legacy-exact' }}
        shell: cmd
        run: |
          subst T: /d >nul 2>nul
          exit /b 0
