name: Run TripLens MATLAB Co-Sim

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Select validation or physical co-simulation stage
        required: true
        type: choice
        default: bfp-cosim
        options:
          - smoke
          - bfp-wrapper-check
          - bfp-cosim
      bfp_trip_time_s:
        description: HP BFP trip start time (bfp-cosim)
        required: true
        default: "300"
      bfp_ramp_duration_s:
        description: HP BFP 1400 to 0 rpm ramp duration (bfp-cosim)
        required: true
        default: "2"
      stop_time_s:
        description: ThermoSysPro simulation stop time
        required: true
        default: "1000"
      intervals:
        description: ThermoSysPro output intervals
        required: true
        default: "1000"

permissions:
  contents: read

concurrency:
  group: triplens-matlab-cosim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matlab-cosim:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180

    steps:
      - name: Check out co-sim repository
        uses: actions/checkout@v4

      - name: Show runner identity
        shell: cmd
        run: |
          echo Runner: %RUNNER_NAME%
          echo Machine: %COMPUTERNAME%
          echo Workspace: %GITHUB_WORKSPACE%
          where omc.exe >nul 2>nul
          if errorlevel 1 (echo OpenModelica: not on PATH; MATLAB will search standard install folders) else (where omc.exe)
          if exist "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" (echo Windows PowerShell: found) else (echo Windows PowerShell: MISSING & exit /b 1)
          exit /b 0

      - name: Prepare ThermoSysPro 4.2 source
        shell: cmd
        run: |
          if exist "vendor\ThermoSysPro\ThermoSysPro\package.mo" (
            echo ThermoSysPro already present in vendor folder.
            exit /b 0
          )
          if exist "vendor\ThermoSysPro" rmdir /s /q "vendor\ThermoSysPro"
          mkdir vendor 2>nul
          echo Cloning official ThermoSysPro source from GitLab...
          "C:\Program Files\Git\cmd\git.exe" clone --depth 1 https://gitlab.pam-retd.fr/thermosysproandco/ThermoSysPro.git "vendor\ThermoSysPro"
          if errorlevel 1 exit /b 1
          if not exist "vendor\ThermoSysPro\ThermoSysPro\package.mo" (
            echo ERROR: ThermoSysPro package.mo missing after clone.
            exit /b 1
          )
          findstr /C:"version = \"4.2\"" "vendor\ThermoSysPro\ThermoSysPro\package.mo" >nul
          if errorlevel 1 (
            echo WARNING: fetched ThermoSysPro does not report version 4.2; continuing for compatibility check.
          ) else (
            echo ThermoSysPro 4.2 source prepared successfully.
          )
          exit /b 0

      - name: Run on installed MATLAB
        shell: cmd
        env:
          TRIPLENS_COSIM_MODE: ${{ inputs.mode || 'bfp-cosim' }}
          TRIPLENS_BFP_TRIP_TIME: ${{ inputs.bfp_trip_time_s || '300' }}
          TRIPLENS_BFP_RAMP_DURATION: ${{ inputs.bfp_ramp_duration_s || '2' }}
          TRIPLENS_STOP_TIME: ${{ inputs.stop_time_s || '1000' }}
          TRIPLENS_INTERVALS: ${{ inputs.intervals || '1000' }}
          TRIPLENS_THERMOSYSPRO_ROOT: ${{ github.workspace }}\vendor\ThermoSysPro
        run: |
          "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File ".\scripts\run_installed_matlab.ps1" -Mode "%TRIPLENS_COSIM_MODE%"

      - name: Upload co-sim outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triplens-matlab-cosim-${{ github.run_number }}
          path: |
            outputs/
            build/bfp_physical/*.mos
          if-no-files-found: warn
          retention-days: 30
