name: Run TripLens MATLAB Co-Sim

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Select validation or physical co-simulation stage
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - bfp-wrapper-check
          - bfp-cosim
      bfp_trip_time_s:
        description: HP BFP trip start time (bfp-cosim)
        required: true
        default: "300"
      bfp_ramp_duration_s:
        description: HP BFP 1400 to 0 rpm ramp duration (bfp-cosim)
        required: true
        default: "2"
      stop_time_s:
        description: ThermoSysPro simulation stop time
        required: true
        default: "1000"
      intervals:
        description: ThermoSysPro output intervals
        required: true
        default: "1000"

permissions:
  contents: read

concurrency:
  group: triplens-matlab-cosim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matlab-cosim:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180

    steps:
      - name: Check out co-sim repository
        uses: actions/checkout@v4

      - name: Show runner identity
        shell: cmd
        run: |
          echo Runner: %RUNNER_NAME%
          echo Machine: %COMPUTERNAME%
          echo Workspace: %GITHUB_WORKSPACE%
          where omc.exe >nul 2>nul
          if errorlevel 1 (echo OpenModelica: not on PATH; MATLAB will search standard install folders) else (where omc.exe)
          if exist "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" (echo Windows PowerShell: found) else (echo Windows PowerShell: MISSING & exit /b 1)
          exit /b 0

      - name: Run on installed MATLAB
        shell: cmd
        env:
          TRIPLENS_COSIM_MODE: ${{ inputs.mode }}
          TRIPLENS_BFP_TRIP_TIME: ${{ inputs.bfp_trip_time_s }}
          TRIPLENS_BFP_RAMP_DURATION: ${{ inputs.bfp_ramp_duration_s }}
          TRIPLENS_STOP_TIME: ${{ inputs.stop_time_s }}
          TRIPLENS_INTERVALS: ${{ inputs.intervals }}
        run: |
          "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File ".\scripts\run_installed_matlab.ps1" -Mode "%TRIPLENS_COSIM_MODE%"

      - name: Upload co-sim outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triplens-matlab-cosim-${{ github.run_number }}
          path: |
            outputs/
            build/bfp_physical/*.mos
          if-no-files-found: warn
          retention-days: 30
