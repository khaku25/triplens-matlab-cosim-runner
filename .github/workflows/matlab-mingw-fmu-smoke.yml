name: MATLAB MinGW Cloud FMU Smoke

on:
  push:
    branches: [main]
    paths:
      - 'ci/matlab_mingw_fmu_smoke.m'
      - 'ci/triplens_fmu_custom_build.m'
      - '.github/workflows/matlab-mingw-fmu-smoke.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  mingw-fmu-smoke:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download validated cloud TripTAC FMU
        uses: actions/download-artifact@v4
        with:
          name: triplens-triptac-cosim-fmu-4
          path: fmu_artifact
          repository: khaku25/triplens-matlab-cosim-runner
          run-id: 34199738020
          github-token: ${{ github.token }}

      - name: Select MinGW and compile cloud FMU sources
        shell: cmd
        run: |
          "C:\Program Files\MATLAB\R2025b\bin\matlab.exe" -batch "addpath(fullfile(getenv('GITHUB_WORKSPACE'),'ci')); matlab_mingw_fmu_smoke"

      - name: Upload Windows-ready FMU
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: triptac-cloud-fmu-win64-mingw-${{ github.run_number }}
          path: outputs/TripLens_CombinedCycle_TripTAC_CoSim_win64.fmu
          if-no-files-found: error
          retention-days: 30
