name: FWP-HP Warm-Start Native Physics

on:
  push:
    branches: [integration/validated-stack-20260909]
    paths:
      - '.github/workflows/fwp-hp-warmstart-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fwp-hp-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fwp-hp-warmstart-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Prepare pinned ThermoSysPro
        shell: bash
        run: |
          set -euo pipefail
          rm -rf fwp_warm
          mkdir -p fwp_warm/vendor fwp_warm/build fwp_warm/results fwp_warm/omhome
          git clone --no-checkout https://github.com/Dwarf-Planet-Project/ThermoSysPro.git fwp_warm/vendor/ThermoSysPro
          git -C fwp_warm/vendor/ThermoSysPro checkout --detach db81ae1b5a6a85f6c6c7693244cafa6087e18ff5

      - name: Build HP-FWP test model with regularized discharge isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          src=Path('fwp_warm/vendor/ThermoSysPro/ThermoSysPro/Examples/CombinedCyclePowerPlant/CombinedCycle_TripTAC.mo')
          txt=src.read_text(encoding='utf-8')
          txt=txt.replace('model CombinedCycle_TripTAC\n','model TripLens_FWP_HP_WarmSeeded\n',1)
          txt=txt.replace('end CombinedCycle_TripTAC;','end TripLens_FWP_HP_WarmSeeded;',1)

          # NORMAL_100 only. 150/550 is DERATING and never used as Trip here.
          txt=txt.replace('Table=[0,606.94; 10,606.94; 600,\n        50; 650,50]',
                          'Table=[0,606.94; 1000,606.94]',1)
          txt=txt.replace('Table=[0,893.75; 10,893.75; 600,423; 650,423]',
                          'Table=[0,893.75; 1000,893.75]',1)

          # Preserve the native PompeAlimHP and original hydraulic topology.
          # Replace only its already-existing RPM source with the separately
          # validated R&D motor coast-down trajectory after a 300 s warm hold.
          pat=re.compile(
              r'ThermoSysPro\.InstrumentationAndControl\.Blocks\.Sources\.Rampe\s+arretPomesHP\(\s*'
              r'Initialvalue=1400,\s*Starttime=4000,\s*Duration=1000,\s*Finalvalue=700\)')
          table=[
              [0,1400],[300.08,1400],[300.5,920],[301,500],[302,185],
              [303,68],[304,25],[305,9],[306,3.4],[307,1.25],[308,0.46],
              [310,0],[420,0]
          ]
          rows='; '.join(f'{t},{rpm}' for t,rpm in table)
          repl=(
              'ThermoSysPro.InstrumentationAndControl.Blocks.Tables.Table1DTemps arretPomesHP(\n'
              f'    Table=[{rows}], option_interpolation=1)')
          txt,n=pat.subn(repl,txt,count=1)
          if n!=1: raise SystemExit(f'HP speed source replacement count={n}')

          # The native static pump changes its enthalpy transport equation at
          # zero flow. Enable its built-in Qeps smoothing for the HP pump only;
          # this adds no component and does not change the hydraulic topology.
          pump_pat=re.compile(
              r'(ThermoSysPro\.WaterSteam\.Machines\.StaticCentrifugalPump\s+PompeAlimHP\(\s*)')
          txt,n=pump_pat.subn(
              r'\1continuous_flow_reversal=true,\n    ',
              txt,
              count=1)
          if n!=1: raise SystemExit(f'HP native flow-regularization count={n}')

          # The original downstream HP admission valve sees the same flow cross
          # zero during coastdown. Enable its library-provided Qeps smoothing so
          # the enthalpy equation does not switch discontinuously at Q=0.
          valve_pat=re.compile(
              r'(ThermoSysPro\.WaterSteam\.PressureLosses\.ControlValve\s+'
              r'Vanne_alimentationMPHP1\(\s*)')
          txt,n=valve_pat.subn(
              r'\1continuous_flow_reversal=true,\n    ',
              txt,
              count=1)
          if n!=1:
              raise SystemExit(f'HP downstream valve flow-regularization count={n}')

          # The HP pump inlet pressure-loss element shares the same reversing
          # flow and must use the same continuous enthalpy transport equation.
          inlet_loss_pat=re.compile(
              r'(ThermoSysPro\.WaterSteam\.PressureLosses\.PipePressureLoss\s+'
              r'perteChargeK3\(\s*)')
          txt,n=inlet_loss_pat.subn(
              r'\1continuous_flow_reversal=true,\n    ',
              txt,
              count=1)
          if n!=1:
              raise SystemExit(f'HP inlet loss flow-regularization count={n}')

          # Keep the original HP valve characteristic and signal, but remove
          # its IF97 property call from the reversing-flow NLS. The fixed
          # density is read from the NORMAL_100 solved state, not guessed.
          native_hp_valve=(
              'ThermoSysPro.WaterSteam.PressureLosses.ControlValve '
              'Vanne_alimentationMPHP1(')
          regularized_hp_valve=(
              'TripLensFwpHpRegularizedControlValve '
              'Vanne_alimentationMPHP1(')
          if txt.count(native_hp_valve)!=1:
              raise SystemExit(f'HP valve type replacement count={txt.count(native_hp_valve)}')
          # CombinedCycle_TripTAC has no HP-pump discharge non-return isolation.
          # The static pump loses its positive-flow operating point before Q=0.
          # Use a continuous, speed-coupled reverse-leak resistance so the DAE
          # remains one structure through coastdown. Keep it inside R&D only.
          declaration=(
              '  model TripLensFwpHpRegularizedNRV\n'
              '    parameter ThermoSysPro.Units.AngularVelocity_rpm VrOpen=1399\n'
              '      "Virtual R&D full-open speed; plant/OEM value pending";\n'
              '    parameter ThermoSysPro.Units.AngularVelocity_rpm VrClosed=1300\n'
              '      "Virtual R&D isolated speed; plant/OEM value pending";\n'
              '    parameter Real Ropen(unit="Pa.s/kg")=1e-3;\n'
              '    parameter Real Rclosed(unit="Pa.s/kg")=2e8\n'
              '      "Virtual R&D reverse-leak resistance; plant/OEM value pending";\n'
              '    parameter Modelica.SIunits.MassFlowRate Qeps=1e-3;\n'
              '    Real opening(min=0, max=1);\n'
              '    Real hydraulicResistance(unit="Pa.s/kg");\n'
              '    Modelica.SIunits.MassFlowRate Q;\n'
              '    Modelica.SIunits.Pressure deltaP;\n'
              '    ThermoSysPro.InstrumentationAndControl.Connectors.InputReal speed;\n'
              '    ThermoSysPro.WaterSteam.Connectors.FluidInlet C1;\n'
              '    ThermoSysPro.WaterSteam.Connectors.FluidOutlet C2;\n'
              '  equation\n'
              '    C1.Q = C2.Q;\n'
              '    C1.h = C2.h;\n'
              '    Q = C1.Q;\n'
              '    deltaP = C1.P - C2.P;\n'
              '    0 = noEvent(if Q > Qeps then C1.h - C1.h_vol else if Q < -Qeps then\n'
              '      C2.h - C2.h_vol else C1.h - 0.5*((C1.h_vol - C2.h_vol)*\n'
              '      Modelica.Math.sin(Modelica.Constants.pi*Q/2/Qeps) + C1.h_vol + C2.h_vol));\n'
              '    opening = max(0, min(1,\n'
              '      (speed.signal - VrClosed)/(VrOpen - VrClosed)));\n'
              '    hydraulicResistance = Ropen + (Rclosed - Ropen)*(1 - opening)^8;\n'
              '    deltaP = hydraulicResistance*Q;\n'
              '  end TripLensFwpHpRegularizedNRV;\n'
              '  model TripLensFwpHpRegularizedControlValve\n'
              '    parameter ThermoSysPro.Units.Cv Cvmax=8005.42;\n'
              '    parameter Integer mode=0 "Compatibility with native valve modifier";\n'
              '    parameter Boolean continuous_flow_reversal=true;\n'
              '    parameter Modelica.SIunits.Density rhoFixed=926.1664940825133\n'
              '      "NORMAL_100 solved-state density; regenerate when golden state changes";\n'
              '  protected\n'
              '    parameter Real eps=1.0;\n'
              '    parameter Modelica.SIunits.MassFlowRate Qeps=1e-3;\n'
              '  public\n'
              '    ThermoSysPro.Units.Cv Cv(start=100);\n'
              '    Modelica.SIunits.MassFlowRate Q(start=75);\n'
              '    ThermoSysPro.Units.DifferentialPressure deltaP;\n'
              '    Modelica.SIunits.Density rho;\n'
              '    Modelica.SIunits.AbsolutePressure Pm(start=1e5);\n'
              '    Modelica.SIunits.SpecificEnthalpy h(start=1e5);\n'
              '    ThermoSysPro.InstrumentationAndControl.Connectors.InputReal Ouv;\n'
              '    ThermoSysPro.WaterSteam.Connectors.FluidInlet C1;\n'
              '    ThermoSysPro.WaterSteam.Connectors.FluidOutlet C2;\n'
              '  equation\n'
              '    C1.h = C2.h;\n'
              '    C1.Q = C2.Q;\n'
              '    h = C1.h;\n'
              '    Q = C1.Q;\n'
              '    deltaP = C1.P - C2.P;\n'
              '    0 = noEvent(if Q > Qeps then C1.h - C1.h_vol else if Q < -Qeps then\n'
              '      C2.h - C2.h_vol else C1.h - 0.5*((C1.h_vol - C2.h_vol)*\n'
              '      Modelica.Math.sin(Modelica.Constants.pi*Q/2/Qeps) + C1.h_vol + C2.h_vol));\n'
              '    deltaP*Cv*abs(Cv) = 1.733e12*\n'
              '      ThermoSysPro.Functions.ThermoSquare(Q, eps)/rhoFixed^2;\n'
              '    Cv = Ouv.signal*Cvmax;\n'
              '    Pm = (C1.P + C2.P)/2;\n'
              '    rho = rhoFixed;\n'
              '  end TripLensFwpHpRegularizedControlValve;\n'
              '  TripLensFwpHpRegularizedNRV tripLensFwpHpDischargeNRV\n'
              '    "R&D-only regularized non-return isolation; not a Competition tag";\n')
          txt,n=re.subn(r'^equation\s*$', declaration+'equation', txt, count=1, flags=re.M)
          if n!=1: raise SystemExit(f'HP discharge NRV declaration count={n}')

          old_discharge=(
              '  connect(Vanne_alimentationMPHP1.C1, PompeAlimHP.C2)\n'
              '    annotation (Line(points={{721,-102.8},{809,-102.8},{809,-50},{791,-50}}));')
          new_discharge=(
              '  connect(PompeAlimHP.C2, tripLensFwpHpDischargeNRV.C1);\n'
              '  connect(tripLensFwpHpDischargeNRV.C2, Vanne_alimentationMPHP1.C1);\n'
              '  connect(arretPomesHP.y, tripLensFwpHpDischargeNRV.speed);')
          if txt.count(old_discharge)!=1:
              raise SystemExit(f'HP discharge connection count={txt.count(old_discharge)}')
          txt=txt.replace(old_discharge,new_discharge,1)

          if 'connect(PompeAlimHP.rpm_or_mpower, arretPomesHP.y)' not in txt:
              raise SystemExit('native HP pump speed connection missing')
          # Warm with the native valve so the proven NORMAL_100 initialization
          # is unchanged. The Trip runtime retains identical component names,
          # replaces only the HP valve equation, and imports the solved state.
          warm_txt=txt
          runtime_txt=txt.replace(native_hp_valve,regularized_hp_valve,1)
          runtime_txt=runtime_txt.replace(
              'model TripLens_FWP_HP_WarmSeeded\n',
              'model TripLens_FWP_HP_TripRuntime\n',
              1)
          runtime_txt=runtime_txt.replace(
              'end TripLens_FWP_HP_WarmSeeded;',
              'end TripLens_FWP_HP_TripRuntime;',
              1)
          Path('fwp_warm/build/TripLens_FWP_HP_WarmSeeded.mo').write_text(
              warm_txt,encoding='utf-8')
          Path('fwp_warm/build/TripLens_FWP_HP_TripRuntime.mo').write_text(
              runtime_txt,encoding='utf-8')
          Path('fwp_warm/results/contract.json').write_text(json.dumps({
              'base_model':'CombinedCycle_TripTAC',
              'thermosyspro_commit':'db81ae1b5a6a85f6c6c7693244cafa6087e18ff5',
              'normal_hold_s':300,
              'trip_request_s':300.0,
              'breaker_open_reference_s':300.08,
              'pump':'PompeAlimHP',
              'native_topology_modified':True,
              'new_motor_component_inserted':False,
              'native_discharge_check_valve_inserted':False,
              'r_and_d_regularized_isolation_adapter_inserted':True,
              'r_and_d_hp_valve_regularized':True,
              'hp_valve_fixed_density_kg_m3':926.1664940825133,
              'r_and_d_discharge_isolation':'TripLensFwpHpRegularizedNRV between PompeAlimHP and Vanne_alimentationMPHP1; speed-coupled continuous resistance, no field/Competition tag',
              'r_and_d_discharge_isolation_parameters':'VrOpen=1399 rpm, VrClosed=1300 rpm, Rclosed=2e8 Pa.s/kg; virtual R&D values pending plant/OEM data',
              'native_numerical_regularization':'PompeAlimHP and perteChargeK3 continuous_flow_reversal=true; HP valve keeps native Cv law with NORMAL_100 fixed density to avoid invalid IF97 trial states',
              'gt_boundary':'NORMAL_100 606.94 kg/s / 893.75 K',
              'coastdown_source':'R&D FWP virtual motor surrogate; tau approx 1 s, not plant-approved',
              'initialization':'native-valve 0-300 solved snapshot -> component-name-compatible regularized HP valve 300-420 CVODE runtime'
          },indent=2),encoding='utf-8')
          print('FWP_HP_WARM_MODEL_BUILD_PASS')
          PY

      - name: Install Modelica 3.2.3
        shell: bash
        run: |
          cat > fwp_warm/build/install.mos <<'MOS'
          installPackage(Modelica, "3.2.3", exactMatch=true);
          getErrorString();
          MOS
          docker run --rm \
            -v "$PWD/fwp_warm/omhome:/root" \
            -v "$PWD/fwp_warm:/workspace" -w /workspace \
            openmodelica/openmodelica:v1.27.0-minimal \
            omc /workspace/build/install.mos | tee fwp_warm/results/install.log

      - name: Create 300 s warm state
        shell: bash
        run: |
          set -euo pipefail
          cat > fwp_warm/build/warm.mos <<'MOS'
          setCommandLineOptions("--std=3.4");
          loadModel(Modelica,{"3.2.3"}); getErrorString();
          loadFile("/workspace/vendor/ThermoSysPro/ThermoSysPro/package.mo"); getErrorString();
          loadFile("/workspace/build/TripLens_FWP_HP_WarmSeeded.mo"); getErrorString();
          cd("/workspace/results");
          checkModel(ThermoSysPro.Examples.CombinedCyclePowerPlant.TripLens_FWP_HP_WarmSeeded); getErrorString();
          simulate(ThermoSysPro.Examples.CombinedCyclePowerPlant.TripLens_FWP_HP_WarmSeeded,
            startTime=0, stopTime=300, numberOfIntervals=3000, tolerance=1e-3,
            method="dassl", outputFormat="mat", fileNamePrefix="fwp_hp_warm",
            variableFilter=".*",
            simflags="-iim=symbolic -noEventEmit -emit_protected");
          getErrorString();
          MOS
          docker run --rm \
            -v "$PWD/fwp_warm/omhome:/root" \
            -v "$PWD/fwp_warm:/workspace" -w /workspace \
            openmodelica/openmodelica:v1.27.0-minimal \
            omc /workspace/build/warm.mos | tee fwp_warm/results/warm.log
          test -s fwp_warm/results/fwp_hp_warm_res.mat
          grep -q "The simulation finished successfully" fwp_warm/results/warm.log

      - name: Build dedicated 300-to-420 CVODE restart executable
        shell: bash
        run: |
          set -euo pipefail
          cat > fwp_warm/build/build_trip_restart.mos <<'MOS'
          setCommandLineOptions("--std=3.4");
          loadModel(Modelica,{"3.2.3"}); getErrorString();
          loadFile("/workspace/vendor/ThermoSysPro/ThermoSysPro/package.mo"); getErrorString();
          loadFile("/workspace/build/TripLens_FWP_HP_TripRuntime.mo"); getErrorString();
          cd("/workspace/results");
          buildModel(ThermoSysPro.Examples.CombinedCyclePowerPlant.TripLens_FWP_HP_TripRuntime,
            startTime=300, stopTime=420, numberOfIntervals=1200, tolerance=1e-3,
            method="cvode", outputFormat="csv", fileNamePrefix="fwp_hp_trip_restart",
            variableFilter="^(time|arretPomesHP\\.y\\.signal|PompeAlimHP\\.Q|CapteurDebitEauHP\\.Measure\\.signal|Ballon(HP|MP|BP)\\.(P|zl)|tripLensFwpHpDischargeNRV\\.opening)$");
          getErrorString();
          MOS
          docker run --rm \
            -v "$PWD/fwp_warm/omhome:/root" \
            -v "$PWD/fwp_warm:/workspace" -w /workspace \
            openmodelica/openmodelica:v1.27.0-minimal \
            omc /workspace/build/build_trip_restart.mos | tee fwp_warm/results/build_trip_restart.log
          test -x fwp_warm/results/fwp_hp_trip_restart

      - name: Restart from solved state and run FWP-HP trip physics
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/fwp_warm/results:/work" \
            -w /work \
            openmodelica/openmodelica:v1.27.0-minimal \
            ./fwp_hp_trip_restart \
              -iif=/work/fwp_hp_warm_res.mat \
              -iit=300 \
              -iim=none \
              -noEventEmit \
              -initialStepSize=1e-4 \
              -maxStepSize=0.01 \
              -r=/work/fwp_hp_trip_raw.csv \
              -lv=LOG_INIT,LOG_STATS | tee fwp_warm/results/trip_restart.log
          test -s fwp_warm/results/fwp_hp_trip_raw.csv
          grep -q "The simulation finished successfully" fwp_warm/results/trip_restart.log

      - name: Validate warm-started physical response
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv,json,math

          p=Path('fwp_warm/results/fwp_hp_trip_raw.csv')
          with p.open(newline='',encoding='utf-8-sig') as f:
              r=csv.reader(f)
              raw_h=next(r)
              rows=list(r)
          h=[x.strip().strip('"') for x in raw_h]
          if len(rows)<100:
              raise SystemExit(f'RAW too short: {len(rows)} rows')

          print('RAW_ROWS',len(rows),'RAW_COLUMNS',len(h))
          relevant=[n for n in h if any(k in n for k in ('PompeAlimHP','arretPomesHP','BallonHP','BallonMP','BallonBP','CapteurDebitEauHP','tripLensFwpHpDischargeNRV'))]
          print('RELEVANT_HEADERS',json.dumps(relevant,ensure_ascii=False))

          def find_col(label, exact=(), contains_all=(), suffixes=()):
              for c in exact:
                  if c in h:
                      print(label,'=',c)
                      return h.index(c)
              for i,n in enumerate(h):
                  if contains_all and all(k in n for k in contains_all):
                      if not suffixes or any(n.endswith(s) for s in suffixes):
                          print(label,'=',n)
                          return i
              raise SystemExit(f'missing {label}; relevant headers={relevant}')

          c_time=find_col('time',exact=('time',))
          c_rpm=find_col(
              'rpm',
              exact=('arretPomesHP.y.signal','arretPomesHP.y','PompeAlimHP.Vr','PompeAlimHP.rpm_or_mpower.signal'),
              contains_all=('arretPomesHP',), suffixes=('.signal','.y'))
          try:
              c_q=find_col('native_pump_flow',exact=('PompeAlimHP.Q',),contains_all=('PompeAlimHP',),suffixes=('.Q',))
          except SystemExit:
              c_q=find_col('native_feedwater_flow',exact=('CapteurDebitEauHP.Measure.signal',),contains_all=('CapteurDebitEauHP',),suffixes=('.signal',))
          c_nrv=find_col(
              'r_and_d_discharge_isolation',
              exact=('tripLensFwpHpDischargeNRV.opening',),
              contains_all=('tripLensFwpHpDischargeNRV',), suffixes=('.opening',))

          drum_names=('BallonHP.zl','BallonHP.P','BallonMP.zl','BallonMP.P','BallonBP.zl','BallonBP.P')
          drum_cols=[(n,h.index(n)) for n in drum_names if n in h]
          if not drum_cols:
              raise SystemExit('no native drum state columns in RAW')

          t=[float(x[c_time]) for x in rows]
          if not all(math.isfinite(x) for x in t):
              raise SystemExit('non-finite time')
          if t[0] > 300.05 or t[-1] < 419.8:
              raise SystemExit(f'incomplete time range {t[0]}..{t[-1]}')
          if any(t[i+1] < t[i] for i in range(len(t)-1)):
              raise SystemExit('time is not monotonic')

          def near(x):
              return min(range(len(t)),key=lambda k:abs(t[k]-x))

          sample_times=[300,300.1,300.5,301,302,305,310,330,360,419.9]
          samples={}
          finite=True
          for ts in sample_times:
              j=near(ts)
              vals={
                  'time_s':t[j],
                  'rpm_command':float(rows[j][c_rpm]),
                  'native_flow':float(rows[j][c_q]),
                  'isolation_opening':float(rows[j][c_nrv]),
              }
              for name,i in drum_cols:
                  vals[name]=float(rows[j][i])
              finite=finite and all(math.isfinite(v) for v in vals.values())
              samples[str(ts)]=vals

          coast=[samples[str(x)]['rpm_command'] for x in [300.1,300.5,301,302,305,310]]
          if not all(coast[i+1] <= coast[i]+1e-6 for i in range(len(coast)-1)):
              raise SystemExit('RPM coastdown not monotonic: '+str(coast))
          if samples['310']['rpm_command'] > 5:
              raise SystemExit('RPM did not reach zero-speed gate: '+str(samples['310']['rpm_command']))
          if not finite:
              raise SystemExit('non-finite major variable')

          if samples['300']['isolation_opening'] < 0.99:
              raise SystemExit('HP discharge isolation is not fully open at the NORMAL_100 boundary')
          opening_after=[samples[str(x)]['isolation_opening'] for x in [301,302,305,310]]
          if max(opening_after) > 0.01:
              raise SystemExit('HP discharge isolation did not close during pump coastdown: '+str(opening_after))
          post_trip_flow=[samples[str(x)]['native_flow'] for x in [301,302,305,310,330]]
          if max(abs(q) for q in post_trip_flow) > 0.2:
              raise SystemExit('regularized HP discharge isolation leakage too large: '+str(post_trip_flow))

          # Demand a real native process response, not merely the commanded RPM.
          q0=samples['300']['native_flow']
          q_candidates=[samples[str(x)]['native_flow'] for x in [301,302,305,310,330]]
          max_q_delta=max(abs(q-q0) for q in q_candidates)
          scale=max(abs(q0),1.0)
          if max_q_delta <= max(1e-6,1e-4*scale):
              raise SystemExit(f'native pump/process flow did not respond: q0={q0}, max_delta={max_q_delta}')

          report={
              'status':'pass',
              'simulation_success':True,
              'warm_state_used':True,
              'restart_method':'emit-protected snapshot + R&D regularized HP discharge isolation + dedicated CVODE executable + iif/iit/iim=none',
              'raw_start_s':t[0],
              'raw_end_s':t[-1],
              'raw_rows':len(rows),
              'major_variables_finite':True,
              'rpm_coastdown_monotonic':True,
              'native_process_response':True,
              'native_flow_max_delta':max_q_delta,
              'r_and_d_discharge_isolation_closed_after_trip':True,
              'post_trip_isolation_flow_bound_kg_s':0.2,
              'resolved_columns':{'rpm':h[c_rpm],'flow':h[c_q],'isolation':h[c_nrv],'drums':[n for n,_ in drum_cols]},
              'samples':samples,
              'guardrail':'FWP motor coastdown constants are virtual-model R&D settings, not plant-approved settings.'
          }
          Path('fwp_warm/results/fwp_hp_warmstart_report.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print('FWP_HP_WARMSTART_NATIVE_PASS')
          print(json.dumps(report,indent=2))
          PY

      - name: Normalize generated evidence permissions
        if: always()
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD/fwp_warm:/workspace" \
            alpine:3.22 \
            sh -c 'chmod -R a+rX /workspace'

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fwp-hp-warmstart-native-${{ github.run_number }}
          path: |
