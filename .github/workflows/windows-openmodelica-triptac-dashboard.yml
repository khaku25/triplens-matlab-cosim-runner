name: Windows OpenModelica TripTAC Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'legacy_exact/modelica/export_windows_triptac_fmu.mos'
      - '.github/workflows/windows-openmodelica-triptac-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-triptac-cosim:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download validated TripTAC wrapper artifact
        uses: actions/download-artifact@v4
        with:
          name: triplens-triptac-cosim-fmu-4
          path: validated_artifact
          repository: khaku25/triplens-matlab-cosim-runner
          run-id: 34199738020
          github-token: ${{ github.token }}

      - name: Map ASCII workspace
        shell: cmd
        run: |
          subst T: /d >nul 2>nul
          subst T: "%GITHUB_WORKSPACE%"
          if errorlevel 1 exit /b 1

      - name: Prepare exact pinned ThermoSysPro and validated wrapper
        shell: cmd
        run: |
          T:
          if exist legacy_exact\vendor\ThermoSysPro rmdir /s /q legacy_exact\vendor\ThermoSysPro
          if exist legacy_exact\build\winfmu rmdir /s /q legacy_exact\build\winfmu
          if exist fmu_artifact rmdir /s /q fmu_artifact
          if exist omhome rmdir /s /q omhome
          mkdir legacy_exact\vendor 2>nul
          mkdir legacy_exact\build\winfmu 2>nul
          mkdir fmu_artifact\cosim 2>nul
          mkdir omhome\AppData\Roaming\.openmodelica\libraries 2>nul
          mkdir omhome\AppData\Local 2>nul
          "C:\Program Files\Git\cmd\git.exe" clone --no-checkout https://github.com/Dwarf-Planet-Project/ThermoSysPro.git legacy_exact\vendor\ThermoSysPro
          if errorlevel 1 exit /b 1
          "C:\Program Files\Git\cmd\git.exe" -C legacy_exact\vendor\ThermoSysPro checkout --detach db81ae1b5a6a85f6c6c7693244cafa6087e18ff5
          if errorlevel 1 exit /b 1
          if not exist validated_artifact\TripLens_CombinedCycle_TripTAC_CoSim.mo exit /b 1
          copy /Y validated_artifact\TripLens_CombinedCycle_TripTAC_CoSim.mo legacy_exact\build\TripLens_CombinedCycle_TripTAC_CoSim.mo
          if not exist legacy_exact\build\TripLens_CombinedCycle_TripTAC_CoSim.mo exit /b 1

      - name: Install exact Modelica dependency in ASCII OpenModelica home
        shell: cmd
        run: |
          set "APPDATA=T:\omhome\AppData\Roaming"
          set "LOCALAPPDATA=T:\omhome\AppData\Local"
          set "USERPROFILE=T:\omhome"
          set "HOME=T:\omhome"
          set "OPENMODELICALIBRARY=T:\omhome\AppData\Roaming\.openmodelica\libraries"
          "C:\Program Files\OpenModelica1.28.0-dev-64bit\bin\omc.exe" T:\legacy_exact\modelica\install_dependencies.mos > T:\legacy_exact\build\winfmu\install_modelica.log 2>&1
          type T:\legacy_exact\build\winfmu\install_modelica.log
          dir /s /b "T:\omhome\AppData\Roaming\.openmodelica\libraries\Modelica*\package.mo" >nul || exit /b 1

      - name: Build FMI 2.0 Co-Simulation FMU with Windows OpenModelica
        shell: cmd
        run: |
          set "APPDATA=T:\omhome\AppData\Roaming"
          set "LOCALAPPDATA=T:\omhome\AppData\Local"
          set "USERPROFILE=T:\omhome"
          set "HOME=T:\omhome"
          set "OPENMODELICALIBRARY=T:\omhome\AppData\Roaming\.openmodelica\libraries"
          "C:\Program Files\OpenModelica1.28.0-dev-64bit\bin\omc.exe" T:\legacy_exact\modelica\export_windows_triptac_fmu.mos > T:\legacy_exact\build\winfmu\export_windows_fmu.log 2>&1
          type T:\legacy_exact\build\winfmu\export_windows_fmu.log
          findstr /c:"Check of ThermoSysPro.Examples.CombinedCyclePowerPlant.TripLens_CombinedCycle_TripTAC_CoSim completed successfully" T:\legacy_exact\build\winfmu\export_windows_fmu.log >nul || exit /b 1
          if not exist T:\legacy_exact\build\winfmu\TripLens_CombinedCycle_TripTAC_CoSim.fmu exit /b 1
          copy /Y T:\legacy_exact\build\winfmu\TripLens_CombinedCycle_TripTAC_CoSim.fmu T:\fmu_artifact\cosim\TripLens_CombinedCycle_TripTAC_CoSim.fmu

      - name: Check Windows FMU archive contains win64
        shell: cmd
        run: |
          tar -tf T:\fmu_artifact\cosim\TripLens_CombinedCycle_TripTAC_CoSim.fmu | findstr /i "binaries/win64" >nul
          if errorlevel 1 exit /b 1

      - name: Build dashboard and run real Simulink-FMU smoke
        shell: cmd
        run: |
          "C:\Program Files\MATLAB\R2025b\bin\matlab.exe" -batch "addpath(fullfile(getenv('GITHUB_WORKSPACE'),'matlab')); build_triptac_cosim_dashboard"

      - name: Upload Windows FMU and co-simulation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triptac-windows-openmodelica-dashboard-${{ github.run_number }}
          path: |
            legacy_exact/build/winfmu/install_modelica.log
            legacy_exact/build/winfmu/export_windows_fmu.log
            fmu_artifact/cosim/TripLens_CombinedCycle_TripTAC_CoSim.fmu
            outputs/triptac_cosim_dashboard_report.json
            outputs/TripLens_ECMS_DigitalTwin.slx
          if-no-files-found: warn
          retention-days: 30

      - name: Remove ASCII workspace mapping
        if: always()
        shell: cmd
        run: |
          subst T: /d >nul 2>nul
          exit /b 0
