name: FWP HP Ramp Then Trip Native Physics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fwp-ramp-trip-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fwp-ramp-trip-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout experiment repo
        uses: actions/checkout@v4

      - name: Prepare pinned ThermoSysPro
        shell: bash
        run: |
          set -euo pipefail
          rm -rf fwp_test
          mkdir -p fwp_test/vendor fwp_test/build fwp_test/omhome fwp_test/results
          git clone --no-checkout https://github.com/Dwarf-Planet-Project/ThermoSysPro.git fwp_test/vendor/ThermoSysPro
          git -C fwp_test/vendor/ThermoSysPro checkout --detach db81ae1b5a6a85f6c6c7693244cafa6087e18ff5
          test "$(git -C fwp_test/vendor/ThermoSysPro rev-parse HEAD)" = "db81ae1b5a6a85f6c6c7693244cafa6087e18ff5"

      - name: Build isolated HP FWP ramp-trip model
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          src = Path('fwp_test/vendor/ThermoSysPro/ThermoSysPro/Examples/CombinedCyclePowerPlant/CombinedCycle_TripTAC.mo')
          txt = src.read_text(encoding='utf-8')
          txt = txt.replace('model CombinedCycle_TripTAC\n', 'model TripLens_FWP_RampTrip\n', 1)
          txt = txt.replace('end CombinedCycle_TripTAC;', 'end TripLens_FWP_RampTrip;', 1)
          pattern = re.compile(
              r'ThermoSysPro\.InstrumentationAndControl\.Blocks\.Sources\.Rampe\s+arretPomesHP\(\s*'
              r'Initialvalue=1400,\s*Starttime=4000,\s*Duration=1000,\s*Finalvalue=700\)'
          )
          replacement = (
              'ThermoSysPro.InstrumentationAndControl.Blocks.Tables.Table1DTemps arretPomesHP(\n'
              '    Table=[0,1400; 5,1400; 10,1540; 14.999,1540; 15,0; 30,0],\n'
              '    option_interpolation=1)'
          )
          txt, n = pattern.subn(replacement, txt, count=1)
          if n != 1:
              raise SystemExit(f'Expected exactly one HP FWP drive source replacement, got {n}')
          if 'connect(PompeAlimHP.rpm_or_mpower, arretPomesHP.y)' not in txt:
              raise SystemExit('HP FWP drive connection not found after patch')
          Path('fwp_test/build/TripLens_FWP_RampTrip.mo').write_text(txt, encoding='utf-8')
          Path('fwp_test/results/experiment_contract.json').write_text(json.dumps({
              'physics_base': 'ThermoSysPro.Examples.CombinedCyclePowerPlant.CombinedCycle_TripTAC',
              'thermosyspro_commit': 'db81ae1b5a6a85f6c6c7693244cafa6087e18ff5',
              'changed_component': 'PompeAlimHP drive source only',
              'drive_source': 'ThermoSysPro Table1DTemps using native OutputReal connector',
              'connection_preserved': 'PompeAlimHP.rpm_or_mpower <- arretPomesHP.y',
              'schedule_rpm': [[0,1400],[5,1400],[10,1540],[14.999,1540],[15,0],[30,0]],
              'intent': 'normal -> +10% HP feedwater pump speed -> hold -> drive loss/trip',
              'original_library_source_modified': False
          }, indent=2), encoding='utf-8')
          print('FWP_MODEL_PATCH_PASS')
          PY

      - name: Install Modelica 3.2.3 in isolated OpenModelica home
        shell: bash
        run: |
          set -euo pipefail
          cat > fwp_test/build/install_dependencies.mos <<'MOS'
          installPackage(Modelica, "3.2.3", exactMatch=true);
          getErrorString();
          MOS
          docker run --rm \
            -v "$PWD/fwp_test/omhome:/root" \
            -v "$PWD/fwp_test:/workspace" \
            -w /workspace \
            openmodelica/openmodelica:v1.27.0-minimal \
            omc /workspace/build/install_dependencies.mos | tee fwp_test/results/install.log

      - name: Run actual 30 s HP FWP ramp then trip physics simulation
        shell: bash
        run: |
          set -euo pipefail
          cat > fwp_test/build/run_fwp_test.mos <<'MOS'
          setCommandLineOptions("--std=3.4");
          loadModel(Modelica, {"3.2.3"});
          getErrorString();
          loadFile("/workspace/vendor/ThermoSysPro/ThermoSysPro/package.mo");
          getErrorString();
          loadFile("/workspace/build/TripLens_FWP_RampTrip.mo");
          getErrorString();
          cd("/workspace/results");
          checkModel(ThermoSysPro.Examples.CombinedCyclePowerPlant.TripLens_FWP_RampTrip);
          getErrorString();
          simulate(ThermoSysPro.Examples.CombinedCyclePowerPlant.TripLens_FWP_RampTrip, startTime=0, stopTime=30, numberOfIntervals=300, tolerance=1e-3, method="dassl", outputFormat="csv", fileNamePrefix="TripLens_FWP_RampTrip", simflags="-noEventEmit");
          getErrorString();
          MOS
          docker run --rm \
            -v "$PWD/fwp_test/omhome:/root" \
            -v "$PWD/fwp_test:/workspace" \
            -w /workspace \
            openmodelica/openmodelica:v1.27.0-minimal \
            omc /workspace/build/run_fwp_test.mos | tee fwp_test/results/simulation.log
          test -s fwp_test/results/TripLens_FWP_RampTrip_res.csv

      - name: Analyze physical response and gate the experiment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, json, math
          from pathlib import Path
          p = Path('fwp_test/results/TripLens_FWP_RampTrip_res.csv')
          with p.open(newline='', encoding='utf-8-sig') as f:
              r = csv.reader(f); header = next(r); rows = list(r)
          if not rows: raise SystemExit('No result rows')
          times = [float(row[0]) for row in rows]
          if abs(times[0]) > 1e-9 or times[-1] < 29.99:
              raise SystemExit(f'Incomplete simulation time range: {times[0]}..{times[-1]}')
          interesting = []
          for i,name in enumerate(header):
              if ('PompeAlimHP' in name or 'BallonHP' in name or 'CapteurDebitEauHP' in name or 'Alternateur' in name or 'arretPomesHP' in name):
                  interesting.append((i,name))
          interesting = sorted(interesting)[:180]
          def nearest(t): return min(range(len(times)), key=lambda k: abs(times[k]-t))
          sample_times = [0,5,10,14.9,15.1,20,30]
          snapshots = {}; finite = True
          for t in sample_times:
              j=nearest(t); snap={'actual_time_s':times[j]}
              for i,name in interesting:
                  try:
                      v=float(rows[j][i]); finite = finite and math.isfinite(v); snap[name]=v
                  except Exception: pass
              snapshots[str(t)] = snap
          cmd_col = next((i for i,n in enumerate(header) if n in ('arretPomesHP.y.signal','PompeAlimHP.rpm')), None)
          cmd_check = None
          if cmd_col is not None:
              vals={str(t):float(rows[nearest(t)][cmd_col]) for t in [5,10,14.9,15.1,20,30]}
              cmd_check=vals
              if not (vals['10'] > vals['5']*1.05): raise SystemExit(f'Pump command/speed did not rise materially: {vals}')
              if not (abs(vals['20']) < max(5.0,abs(vals['10'])*0.05)): raise SystemExit(f'Pump command/speed did not collapse after trip: {vals}')
          if not finite: raise SystemExit('Non-finite value found in sampled physical outputs')
          report={
              'status':'pass','simulation_start_s':times[0],'simulation_end_s':times[-1],
              'samples':len(rows),'interesting_variable_count':len(interesting),
              'interesting_variables':[n for _,n in interesting],'drive_check':cmd_check,
              'snapshots':snapshots,
              'interpretation_guardrail':'Native process-side FWP drive-loss experiment; not yet ECMS breaker/relay initiated electrical trip.'
          }
          Path('fwp_test/results/fwp_ramp_trip_report.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print('FWP_RAMP_TRIP_NATIVE_PHYSICS_PASS')
          print(json.dumps({'drive_check':cmd_check,'interesting_variables':report['interesting_variables'][:30]},indent=2))
          PY

      - name: Upload FWP experiment evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fwp-ramp-trip-native-${{ github.run_number }}
          path: |
            fwp_test/results/
            fwp_test/build/TripLens_FWP_RampTrip.mo
          if-no-files-found: warn
          retention-days: 30
