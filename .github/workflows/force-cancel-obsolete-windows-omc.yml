name: Force Cancel Obsolete Windows OMC Run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-cancel-obsolete-windows-omc.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  force-cancel-obsolete-run:
    runs-on: ubuntu-latest
    steps:
      - name: Force cancel obsolete Windows OpenModelica run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/khaku25/triplens-matlab-cosim-runner/actions/runs/34208642421/force-cancel
          echo "Obsolete Windows OMC run force-cancellation requested."
