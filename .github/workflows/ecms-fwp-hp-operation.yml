name: Build ECMS FWP HP Operation Logic

on:
  push:
    branches: [main]
    paths:
      - 'ecms_pump_logic/**'
      - '.github/workflows/ecms-fwp-hp-operation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ecms_pump_logic/**'
      - '.github/workflows/ecms-fwp-hp-operation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fwp-hp-operation:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build test and install FWP HP operation mechanism
        shell: cmd
        run: |
          "C:\Program Files\MATLAB\R2025b\bin\matlab.exe" -batch "addpath(fullfile(getenv('GITHUB_WORKSPACE'),'ecms_pump_logic')); build_fwp_hp_operation; install_fwp_hp_operation_into_ecms"

      - name: Upload ECMS FWP HP operation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecms-fwp-hp-operation-${{ github.run_number }}
          path: |
            outputs/TripLens_ECMS_FWP_HP_Operation_Core.slx
            outputs/ecms_fwp_hp_operation_report.json
            outputs/ecms_fwp_hp_operation_timeline.csv
            outputs/ecms_fwp_hp_operation_core.png
            outputs/ecms_fwp_hp_install_report.json
            outputs/ecms_fwp_hp_installed.png
          if-no-files-found: warn
          retention-days: 30
