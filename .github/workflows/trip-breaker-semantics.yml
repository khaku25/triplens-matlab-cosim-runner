name: Trip Breaker Semantics

on:
  push:
    branches: [main]
    paths:
      - 'ecms_contract/trip_breaker_contract_v1.csv'
      - 'ecms_logic/build_trip_breaker_semantics_core.m'
      - 'matlab/apply_trip_breaker_semantics_v2.m'
      - 'matlab/build_closed_loop_trip_cosim.m'
      - 'matlab/build_closed_loop_trip_cosim_v2.m'
      - '.github/workflows/trip-breaker-semantics.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trip-breaker-semantics
  cancel-in-progress: true

jobs:
  matlab-trip-breaker-semantics:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and regress breaker-state semantics
        shell: cmd
        run: |
          "C:\Program Files\MATLAB\R2025b\bin\matlab.exe" -batch "addpath(fullfile(getenv('GITHUB_WORKSPACE'),'ecms_logic')); build_trip_breaker_semantics_core" > "trip_breaker_semantics.log" 2>&1
          findstr /C:"TRIPLENS TRIP BREAKER SEMANTICS PASS=1" trip_breaker_semantics.log >nul || (type trip_breaker_semantics.log & exit /b 1)
          findstr /C:"TRIP_SUCCESS_REQUIRED_BREAKER_CLOSED=0" trip_breaker_semantics.log >nul || exit /b 1
          findstr /C:"DERATING_BREAKER_CLOSED=1" trip_breaker_semantics.log >nul || exit /b 1
      - name: Build canonical integrated closed-loop v2
        shell: cmd
        run: |
          "C:\Program Files\MATLAB\R2025b\bin\matlab.exe" -batch "addpath(fullfile(getenv('GITHUB_WORKSPACE'),'matlab')); build_closed_loop_trip_cosim" > "closed_loop_trip_v2.log" 2>&1
          findstr /C:"TRIPLENS CLOSED LOOP TRIP SEMANTICS V2 STRUCTURAL PASS" closed_loop_trip_v2.log >nul || (type closed_loop_trip_v2.log & exit /b 1)
          findstr /C:"TRIP_REQUIRES_BREAKER_CLOSED_ZERO=1" closed_loop_trip_v2.log >nul || exit /b 1
          findstr /C:"GT_150_550_CLASSIFICATION=DERATING" closed_loop_trip_v2.log >nul || exit /b 1
      - name: Install compatibility semantics overlay and verify idempotence
        shell: cmd
        run: |
          "C:\Program Files\MATLAB\R2025b\bin\matlab.exe" -batch "addpath(fullfile(getenv('GITHUB_WORKSPACE'),'matlab')); apply_trip_breaker_semantics_v2" > "trip_semantics_v2_install.log" 2>&1
          findstr /C:"TRIPLENS INTEGRATED TRIP SEMANTICS V2 STRUCTURAL PASS" trip_semantics_v2_install.log >nul || (type trip_semantics_v2_install.log & exit /b 1)
          findstr /C:"GT_DERATING_RECLASSIFIED=1" trip_semantics_v2_install.log >nul || exit /b 1
          findstr /C:"GT_52_CLOSED_FEEDBACK_STATEFUL=1" trip_semantics_v2_install.log >nul || exit /b 1
          findstr /C:"ST_52_CLOSED_FEEDBACK_STATEFUL=1" trip_semantics_v2_install.log >nul || exit /b 1
      - name: Upload semantics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trip-breaker-semantics-${{ github.run_number }}
          path: |
            trip_breaker_semantics.log
            closed_loop_trip_v2.log
            trip_semantics_v2_install.log
            outputs/trip_breaker_semantics_report.json
            outputs/closed_loop_trip_cosim_v2_report.json
            outputs/trip_semantics_v2_install_report.json
            outputs/TripLens_ECMS_Trip_Breaker_Semantics_Core.slx
            outputs/TripLens_ECMS_DigitalTwin_closed_loop_v2.slx
            outputs/TripLens_ECMS_DigitalTwin_trip_semantics_v2.slx
          if-no-files-found: warn
          retention-days: 30
