name: Windows TripTAC Co-Sim Dashboard (Legacy Manual)

# The automatic path is now .github/workflows/closed-loop-trip-cosim.yml,
# triggered by each successful Build TripTAC Co-Sim FMU run. This legacy
# dashboard workflow is retained only for manual historical reproduction of the
# old two-input artifact and must not run automatically against the new 3-input
# physical ST-trip contract.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  legacy-windows-cosim-dashboard:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stop with migration guidance
        shell: cmd
        run: |
          echo This legacy workflow used a pinned 2-input FMU artifact.
          echo Use the Closed Loop ECMS Thermo Trip workflow for the current 3-input physical trip path.
