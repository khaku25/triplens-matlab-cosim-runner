name: Validate ECMS Twin Contract

on:
  push:
    branches:
      - main
    paths:
      - 'ecms_contract/**'
      - '.github/workflows/ecms-twin-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecms-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate ECMS to twin one-to-one contract
        run: python3 ecms_contract/validate_ecms_twin_contract.py

      - name: Upload ECMS contract report
        uses: actions/upload-artifact@v4
        with:
          name: ecms-twin-contract-${{ github.run_number }}
          path: ecms_contract/ecms_twin_contract_report.json
          if-no-files-found: error
          retention-days: 30
